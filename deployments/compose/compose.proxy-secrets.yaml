# Optional overlay for enabling browser authentication.
# The mounted file must contain 32 random bytes encoded as unpadded base64url
# and be readable only by the container owner (0600).
services:
  api:
    environment:
      CONTROL_PROXY_CREDENTIAL_KEY_FILE: /run/proxy-secrets/proxy.key
      CONTROL_SETUP_TOKEN_FILE: ${CONTROL_SETUP_TOKEN_FILE:-}
    volumes:
      - "${CONTROL_PROXY_CREDENTIAL_SECRET_DIR:?set CONTROL_PROXY_CREDENTIAL_SECRET_DIR to an absolute private key directory}:/run/proxy-secrets:ro"
