# Optional overlay for enabling durable multi-hop edge secrets.
# The mounted file must contain 32 random bytes encoded as unpadded base64url
# and be readable only by the container owner (0600).
services:
  api:
    environment:
      CONTROL_RELAY_SECRET_KEY_FILE: /run/relay-secrets/relay.key
    volumes:
      - "${CONTROL_RELAY_SECRET_DIR:?set CONTROL_RELAY_SECRET_DIR to an absolute private key directory}:/run/relay-secrets:ro"
