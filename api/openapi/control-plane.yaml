openapi: 3.1.0
info:
  title: Network Control Plane API
  version: 0.1.0
  description: Health, browser identity, user lifecycle, resource directory, entitlement, single-hop line, direct forwarding and Agent enrollment contracts for the independently designed network control plane. Browser identity and Agent enrollment require HTTPS.
servers:
  - url: http://127.0.0.1:8080
paths:
  /api/v1/admin/nodes/{id}/agent-enrollment:
    post:
      operationId: createAgentEnrollmentToken
      summary: Issue a ten-minute one-time enrollment token for a node
      description: Requires an administrator browser session with agents.write, CSRF and current password reauthentication. Available only when Agent TLS is configured; the public HTTP preview keeps browser authentication disabled. Issuing another token for the same node revokes its previous unused token. The action is audited without storing the token; the token appears only in this response.
      security: [{browserSession: []}]
      parameters:
        - in: path
          name: id
          required: true
          schema: {type: string, format: uuid}
        - {$ref: '#/components/parameters/CSRFToken'}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [password]
              properties:
                password: {type: string, format: password}
      responses:
        '201':
          description: One-time Agent enrollment token.
          content:
            application/json:
              schema:
                type: object
                required: [token, expires_at]
                properties:
                  token: {type: string}
                  expires_at: {type: string, format: date-time}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '429': {$ref: '#/components/responses/RateLimited'}
        '500': {$ref: '#/components/responses/InternalError'}
  /api/v1/agent/enroll:
    post:
      operationId: enrollAgent
      summary: Exchange a one-time Agent token and Ed25519 CSR for a client certificate
      description: Served only by the dedicated TLS Agent listener when configured. The public HTTP preview does not mount this endpoint. The token is valid for 10 minutes and consumed once. The private key remains on the Agent. The server certificate must be trusted and cover the address used by the Agent.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [token, csr_pem, version]
              properties:
                token: {type: string, description: One-time bearer token issued for an existing node.}
                csr_pem: {type: string, description: PEM encoded PKCS#10 Ed25519 certificate request.}
                version: {type: string, description: Agent software version.}
      responses:
        '201':
          description: Short-lived client certificate bound to the enrolled node.
          content:
            application/json:
              schema:
                type: object
                required: [node_id, certificate_pem, ca_certificate_pem, expires_at]
                properties:
                  node_id: {type: string, format: uuid}
                  certificate_pem: {type: string}
                  ca_certificate_pem: {type: string}
                  expires_at: {type: string, format: date-time}
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429': {$ref: '#/components/responses/RateLimited'}
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/health/live:
    get:
      operationId: getLiveness
      summary: Process liveness
      responses:
        '200':
          description: The HTTP process can serve requests.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/health/ready:
    get:
      operationId: getReadiness
      summary: Initial process readiness
      description: Checks the PostgreSQL connection with a two-second timeout.
      responses:
        '200':
          description: The process is ready to serve current endpoints.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/DependencyUnavailable'
  /api/v1/auth/login:
    post:
      operationId: login
      summary: Create a browser session
      description: Requires HTTPS. Sets a Secure HttpOnly session cookie and a readable CSRF cookie.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              additionalProperties: false
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
      responses:
        '200':
          description: Authenticated browser session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/auth/logout:
    post:
      operationId: logout
      summary: Revoke the current browser session
      security:
        - browserSession: []
      parameters:
        - in: header
          name: X-CSRF-Token
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Session revoked and cookies cleared
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/me:
    get:
      operationId: getCurrentUser
      summary: Get the current account
      security:
        - browserSession: []
      responses:
        '200':
          description: Current account and effective permissions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v1/me/permissions:
    get:
      operationId: getCurrentPermissions
      summary: Get effective role and permission codes
      security:
        - browserSession: []
      responses:
        '200':
          description: Effective roles and permissions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PermissionsResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v1/me/password:
    post:
      operationId: changeMyPassword
      summary: Change the authenticated user's password and revoke all sessions
      security: [{browserSession: []}]
      parameters:
        - in: header
          name: X-CSRF-Token
          required: true
          schema: {type: string}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/PasswordChange'}
      responses:
        '204':
          description: Password changed; all browser sessions revoked and cookies cleared.
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '422': {$ref: '#/components/responses/ValidationError'}
        '429': {$ref: '#/components/responses/RateLimited'}
  /api/v1/admin/users:
    get:
      operationId: listUsers
      summary: List users (administrator)
      security: [{browserSession: []}]
      parameters:
        - {$ref: '#/components/parameters/PageLimit'}
        - {$ref: '#/components/parameters/PageCursor'}
      responses:
        '200':
          description: Users
          content:
            application/json:
              schema: {$ref: '#/components/schemas/UserList'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
    post:
      operationId: createUser
      summary: Create an active normal user (administrator)
      description: Set an initial password over HTTPS and share it with the user through an approved channel. The response and audit log omit the password.
      security: [{browserSession: []}]
      parameters:
        - in: header
          name: X-CSRF-Token
          required: true
          schema: {type: string}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/NewUser'}
      responses:
        '201':
          description: Created user without password material
          content:
            application/json:
              schema: {$ref: '#/components/schemas/User'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/ValidationError'}
  /api/v1/admin/plans:
    get:
      operationId: listPlans
      summary: List plans (administrator)
      security: [{browserSession: []}]
      parameters:
        - {$ref: '#/components/parameters/PageLimit'}
        - {$ref: '#/components/parameters/PageCursor'}
      responses:
        '200':
          description: Plans
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PlanList'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
    post:
      operationId: createPlan
      summary: Create an active plan with explicit grants (administrator)
      security: [{browserSession: []}]
      parameters:
        - in: header
          name: X-CSRF-Token
          required: true
          schema: {type: string}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/NewPlan'}
      responses:
        '201':
          description: Created plan
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Plan'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/ValidationError'}
  /api/v1/admin/memberships:
    post:
      operationId: createMembership
      summary: Assign an immediately active membership (administrator)
      description: Copies current plan grants and limits to an immutable membership snapshot.
      security: [{browserSession: []}]
      parameters:
        - in: header
          name: X-CSRF-Token
          required: true
          schema: {type: string}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/NewMembership'}
      responses:
        '201':
          description: Created active membership
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Membership'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/ValidationError'}
  /api/v1/my/membership:
    get:
      operationId: getMyMembership
      summary: Get the authenticated user's current membership
      security: [{browserSession: []}]
      responses:
        '200':
          description: Current membership
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Membership'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /api/v1/my/entitlements:
    get:
      operationId: getMyEntitlements
      summary: Get the authenticated user's frozen current plan entitlements
      security: [{browserSession: []}]
      responses:
        '200':
          description: Current membership snapshot
          content:
            application/json:
              schema: {$ref: '#/components/schemas/EntitlementSnapshot'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /api/v1/admin/resource-groups:
    get:
      operationId: listResourceGroups
      summary: List all resource groups (administrator)
      security: [{browserSession: []}]
      parameters:
        - {$ref: '#/components/parameters/PageLimit'}
        - {$ref: '#/components/parameters/PageCursor'}
      responses:
        '200':
          description: Resource groups
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResourceGroupList'
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
    post:
      operationId: createResourceGroup
      summary: Create a resource group (administrator)
      security: [{browserSession: []}]
      parameters:
        - in: header
          name: X-CSRF-Token
          required: true
          schema: {type: string}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/NewResourceGroup'}
      responses:
        '201':
          description: Created group
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ResourceGroup'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/ValidationError'}
  /api/v1/admin/nodes:
    get:
      operationId: listAllNodes
      summary: List all nodes (administrator)
      security: [{browserSession: []}]
      parameters:
        - {$ref: '#/components/parameters/PageLimit'}
        - {$ref: '#/components/parameters/PageCursor'}
      responses:
        '200':
          description: All nodes
          content:
            application/json:
              schema: {$ref: '#/components/schemas/NodeList'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
    post:
      operationId: createNode
      summary: Create a node (administrator)
      security: [{browserSession: []}]
      parameters:
        - in: header
          name: X-CSRF-Token
          required: true
          schema: {type: string}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/NewNode'}
      responses:
        '201':
          description: Created node
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Node'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/ValidationError'}
  /api/v1/nodes:
    get:
      operationId: listAllowedNodes
      summary: List nodes allowed by the active membership snapshot
      security: [{browserSession: []}]
      parameters:
        - {$ref: '#/components/parameters/PageLimit'}
        - {$ref: '#/components/parameters/PageCursor'}
      responses:
        '200':
          description: Authorized and enabled nodes
          content:
            application/json:
              schema: {$ref: '#/components/schemas/NodeList'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /api/v1/nodes/{id}:
    get:
      operationId: getAllowedNode
      summary: Get an authorized node
      security: [{browserSession: []}]
      parameters:
        - in: path
          name: id
          required: true
          schema: {type: string, format: uuid}
      responses:
        '200':
          description: Authorized node
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Node'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /api/v1/admin/lines:
    get:
      operationId: listAllLines
      summary: List single-hop lines (administrator)
      security: [{browserSession: []}]
      parameters:
        - {$ref: '#/components/parameters/PageLimit'}
        - {$ref: '#/components/parameters/PageCursor'}
      responses:
        '200':
          description: Single-hop lines
          content:
            application/json:
              schema: {$ref: '#/components/schemas/LineList'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
    post:
      operationId: createSharedLine
      summary: Create a shared single-hop line (administrator)
      security: [{browserSession: []}]
      parameters:
        - {$ref: '#/components/parameters/CSRFToken'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/NewLine'}
      responses:
        '201':
          description: Shared line
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Line'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/ValidationError'}
  /api/v1/admin/lines/{id}:
    parameters:
      - {$ref: '#/components/parameters/LineID'}
    get:
      operationId: getLineAsAdmin
      summary: Get a single-hop line (administrator)
      security: [{browserSession: []}]
      responses:
        '200':
          description: Line
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Line'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
    patch:
      operationId: updateSharedLine
      summary: Update shared line metadata (administrator)
      security: [{browserSession: []}]
      parameters:
        - {$ref: '#/components/parameters/CSRFToken'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/LinePatch'}
      responses:
        '200':
          description: Updated line
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Line'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/ValidationError'}
  /api/v1/lines:
    get:
      operationId: listAllowedLines
      summary: List shared lines granted by the current membership and owned lines
      security: [{browserSession: []}]
      parameters:
        - {$ref: '#/components/parameters/PageLimit'}
        - {$ref: '#/components/parameters/PageCursor'}
      responses:
        '200':
          description: Lines manageable by this user; disabled owned lines remain visible
          content:
            application/json:
              schema: {$ref: '#/components/schemas/LineList'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
    post:
      operationId: createOwnLine
      summary: Create an authorized owned single-hop line
      security: [{browserSession: []}]
      parameters:
        - {$ref: '#/components/parameters/CSRFToken'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/NewLine'}
      responses:
        '201':
          description: Created owned line
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Line'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/ValidationError'}
  /api/v1/lines/{id}:
    parameters:
      - {$ref: '#/components/parameters/LineID'}
    get:
      operationId: getAllowedLine
      summary: Get an allowed shared or owned line
      security: [{browserSession: []}]
      responses:
        '200':
          description: Line
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Line'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
    patch:
      operationId: updateOwnLine
      summary: Update metadata of an owned line
      security: [{browserSession: []}]
      parameters:
        - {$ref: '#/components/parameters/CSRFToken'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/LinePatch'}
      responses:
        '200':
          description: Updated owned line
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Line'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/ValidationError'}
    delete:
      operationId: deleteOwnLine
      summary: Delete an unreferenced owned line
      security: [{browserSession: []}]
      parameters:
        - {$ref: '#/components/parameters/CSRFToken'}
      responses:
        '204': {description: Owned line deleted}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
  /api/v1/forward-rules:
    get:
      operationId: listOwnForwardRules
      summary: List the current user's forwarding rules
      security: [{browserSession: []}]
      parameters:
        - {$ref: '#/components/parameters/PageLimit'}
        - {$ref: '#/components/parameters/PageCursor'}
      responses:
        '200':
          description: Forward rules, including disabled rules
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ForwardRuleList'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
    post:
      operationId: createForwardRule
      summary: Reserve a direct TCP, UDP or BOTH forwarding port
      description: The target kind, physical protocol and destination port must match enabled administrator policies; absent policies deny by default. The rule remains pending until the ingress Agent applies it. A disabled rule still reserves its port. Multi-hop line selection is not accepted by this endpoint yet.
      security: [{browserSession: []}]
      parameters:
        - {$ref: '#/components/parameters/CSRFToken'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/NewForwardRule'}
      responses:
        '201':
          description: Durable pending or disabled forward rule
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ForwardRule'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/ValidationError'}
  /api/v1/forward-rules/{id}:
    parameters:
      - {$ref: '#/components/parameters/ForwardRuleID'}
    get:
      operationId: getOwnForwardRule
      summary: Get an owned forwarding rule
      security: [{browserSession: []}]
      responses:
        '200':
          description: Forward rule
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ForwardRule'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
    patch:
      operationId: updateOwnForwardRule
      summary: Rename or enable/disable an owned forwarding rule
      description: Endpoint, port, protocol and target are immutable; delete and recreate the rule to change them.
      security: [{browserSession: []}]
      parameters:
        - {$ref: '#/components/parameters/CSRFToken'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ForwardRulePatch'}
      responses:
        '200':
          description: Updated forward rule
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ForwardRule'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/ValidationError'}
    delete:
      operationId: deleteOwnForwardRule
      summary: Delete an owned rule and release its port reservations
      security: [{browserSession: []}]
      parameters:
        - {$ref: '#/components/parameters/CSRFToken'}
      responses:
        '204': {description: Rule deleted}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /api/v1/admin/forward-target-policies:
    get:
      operationId: listForwardTargetPolicies
      summary: List administrator-approved forwarding destinations
      security: [{browserSession: []}]
      parameters:
        - {$ref: '#/components/parameters/PageLimit'}
        - {$ref: '#/components/parameters/PageCursor'}
      responses:
        '200':
          description: Destination policies
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ForwardTargetPolicyList'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
    post:
      operationId: createForwardTargetPolicy
      summary: Approve a destination kind, protocol and port range
      security: [{browserSession: []}]
      parameters:
        - {$ref: '#/components/parameters/CSRFToken'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/NewForwardTargetPolicy'}
      responses:
        '201':
          description: Approved destination policy
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ForwardTargetPolicy'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/ValidationError'}
  /api/v1/admin/forward-target-policies/{id}:
    parameters:
      - {$ref: '#/components/parameters/ForwardTargetPolicyID'}
    get:
      operationId: getForwardTargetPolicy
      summary: Get a forwarding destination policy
      security: [{browserSession: []}]
      responses:
        '200':
          description: Destination policy
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ForwardTargetPolicy'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
    patch:
      operationId: updateForwardTargetPolicy
      summary: Enable or disable a forwarding destination policy
      security: [{browserSession: []}]
      parameters:
        - {$ref: '#/components/parameters/CSRFToken'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ForwardTargetPolicyPatch'}
      responses:
        '200':
          description: Updated destination policy
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ForwardTargetPolicy'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422': {$ref: '#/components/responses/ValidationError'}
    delete:
      operationId: deleteForwardTargetPolicy
      summary: Revoke a forwarding destination policy
      security: [{browserSession: []}]
      parameters:
        - {$ref: '#/components/parameters/CSRFToken'}
      responses:
        '204': {description: Destination policy deleted}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
components:
  parameters:
    ForwardTargetPolicyID:
      in: path
      name: id
      required: true
      schema: {type: string, format: uuid}
    ForwardRuleID:
      in: path
      name: id
      required: true
      schema: {type: string, format: uuid}
    LineID:
      in: path
      name: id
      required: true
      schema: {type: string, format: uuid}
    CSRFToken:
      in: header
      name: X-CSRF-Token
      required: true
      schema: {type: string}
    PageLimit:
      in: query
      name: limit
      schema: {type: integer, minimum: 1, maximum: 200, default: 100}
    PageCursor:
      in: query
      name: cursor
      description: Opaque next_cursor value from the preceding list response.
      schema: {type: string}
  securitySchemes:
    browserSession:
      type: apiKey
      in: cookie
      name: __Host-control_session
  headers:
    RequestID:
      description: Server generated request identifier for support and logs.
      schema:
        type: string
  responses:
    BadRequest:
      description: Invalid request body.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: Missing, expired or invalid session or credentials.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: Permission denied, or CSRF token missing or invalid.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Conflict:
      description: Resource already exists.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorResponse'}
    ValidationError:
      description: Input is structurally valid JSON but has invalid fields.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorResponse'}
    RateLimited:
      description: Login rate limit reached. Retry-After gives the wait in seconds.
      headers:
        Retry-After:
          schema:
            type: integer
            minimum: 1
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    InternalError:
      description: Unexpected server error.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestID'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: Resource not found.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestID'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    DependencyUnavailable:
      description: PostgreSQL is unavailable.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestID'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  schemas:
    NewLine:
      type: object
      required: [name, node_id]
      additionalProperties: false
      properties:
        name: {type: string, minLength: 1, maxLength: 100}
        node_id: {type: string, format: uuid, description: 'Sole egress hop; immutable in this release.'}
        enabled: {type: boolean, default: true}
        priority: {type: integer, minimum: 0, maximum: 1000, default: 100}
        weight: {type: integer, minimum: 1, maximum: 100, default: 1}
        multiplier_milli: {type: integer, minimum: 1, maximum: 100000, description: 'Administrator shared lines only.'}
        tags:
          type: array
          maxItems: 16
          uniqueItems: true
          items: {type: string, minLength: 1, maxLength: 32}
    LinePatch:
      type: object
      minProperties: 1
      additionalProperties: false
      properties:
        name: {type: string, minLength: 1, maxLength: 100}
        enabled: {type: boolean}
        priority: {type: integer, minimum: 0, maximum: 1000}
        weight: {type: integer, minimum: 1, maximum: 100}
        multiplier_milli: {type: integer, minimum: 1, maximum: 100000, description: 'Administrator shared lines only.'}
        tags:
          type: array
          maxItems: 16
          uniqueItems: true
          items: {type: string, minLength: 1, maxLength: 32}
    LineHop:
      type: object
      required: [position, node_id, role]
      properties:
        position: {type: integer, const: 0}
        node_id: {type: string, format: uuid}
        role: {type: string, const: egress}
    Line:
      type: object
      required: [id, owner_user_id, name, enabled, priority, weight, multiplier_milli, tags, hops, created_at, updated_at]
      properties:
        id: {type: string, format: uuid}
        owner_user_id: {type: ['string', 'null'], format: uuid}
        name: {type: string}
        enabled: {type: boolean}
        priority: {type: integer}
        weight: {type: integer}
        multiplier_milli: {type: ['integer', 'null']}
        tags:
          type: array
          items: {type: string}
        hops:
          type: array
          minItems: 1
          maxItems: 1
          items: {$ref: '#/components/schemas/LineHop'}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    LineList:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/Line'}
        next_cursor: {type: ['string', 'null']}
    NewForwardTargetPolicy:
      type: object
      required: [kind, protocol, port_start, port_end]
      additionalProperties: false
      properties:
        kind: {type: string, enum: [public_host, node]}
        target_group_id: {type: string, format: uuid, description: 'Required for node policies; forbidden for public_host.'}
        protocol: {type: string, enum: [TCP, UDP]}
        port_start: {type: integer, minimum: 1, maximum: 65535}
        port_end: {type: integer, minimum: 1, maximum: 65535}
        enabled: {type: boolean, default: true}
    ForwardTargetPolicyPatch:
      type: object
      required: [enabled]
      additionalProperties: false
      properties:
        enabled: {type: boolean}
    ForwardTargetPolicy:
      type: object
      required: [id, kind, target_group_id, protocol, port_start, port_end, enabled, created_at, updated_at]
      properties:
        id: {type: string, format: uuid}
        kind: {type: string, enum: [public_host, node]}
        target_group_id: {type: ['string', 'null'], format: uuid}
        protocol: {type: string, enum: [TCP, UDP]}
        port_start: {type: integer}
        port_end: {type: integer}
        enabled: {type: boolean}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    ForwardTargetPolicyList:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/ForwardTargetPolicy'}
        next_cursor: {type: ['string', 'null']}
    NewForwardRule:
      type: object
      required: [name, ingress_node_id, ingress_port, target_port, protocol]
      additionalProperties: false
      oneOf:
        - required: [target_node_id]
          not: {required: [target_host]}
        - required: [target_host]
          not: {required: [target_node_id]}
      properties:
        name: {type: string, minLength: 1, maxLength: 100}
        ingress_node_id: {type: string, format: uuid}
        ingress_port: {type: integer, minimum: 1024, maximum: 65535}
        target_node_id: {type: string, format: uuid}
        target_host: {type: string, description: 'Public IP literal or DNS hostname; resolved addresses must be checked by the Agent.'}
        target_port: {type: integer, minimum: 1, maximum: 65535}
        protocol: {type: string, enum: [TCP, UDP, BOTH]}
        enabled: {type: boolean, default: true}
    ForwardRulePatch:
      type: object
      minProperties: 1
      additionalProperties: false
      properties:
        name: {type: string, minLength: 1, maxLength: 100}
        enabled: {type: boolean}
    ForwardRule:
      type: object
      required: [id, user_id, name, ingress_node_id, ingress_port, target_node_id, target_host, target_port, line_id, protocol, enabled, apply_status, created_at, updated_at]
      properties:
        id: {type: string, format: uuid}
        user_id: {type: string, format: uuid}
        name: {type: string}
        ingress_node_id: {type: string, format: uuid}
        ingress_port: {type: integer}
        target_node_id: {type: ['string', 'null'], format: uuid}
        target_host: {type: ['string', 'null']}
        target_port: {type: integer}
        line_id: {type: ['string', 'null'], format: uuid, description: 'Always null in the direct-only release.'}
        protocol: {type: string, enum: [TCP, UDP, BOTH]}
        enabled: {type: boolean}
        apply_status: {type: string, enum: [pending, active, apply_failed, disabled]}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    ForwardRuleList:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/ForwardRule'}
        next_cursor: {type: ['string', 'null']}
    NewUser:
      type: object
      required: [email, password]
      additionalProperties: false
      properties:
        email: {type: string, format: email, maxLength: 254}
        password: {type: string, writeOnly: true, description: '12 to 72 UTF-8 bytes.'}
        timezone: {type: string, default: Asia/Shanghai}
    PasswordChange:
      type: object
      required: [old_password, new_password]
      additionalProperties: false
      properties:
        old_password: {type: string, writeOnly: true}
        new_password: {type: string, writeOnly: true, description: '12 to 72 UTF-8 bytes; must differ from the old password.'}
    UserList:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/User'}
        next_cursor: {type: ['string', 'null']}
    NewPlanLimits:
      type: object
      properties:
        max_forward_rules_per_node: {type: integer, minimum: 0, default: 0}
        max_subscriptions: {type: integer, minimum: 0, default: 0}
        max_routing_rules: {type: integer, minimum: 0, default: 0}
        allow_custom_lines: {type: boolean, default: false}
        max_custom_lines: {type: integer, minimum: 0, default: 0}
        max_hops: {type: integer, const: 1, default: 1}
    PlanLimits:
      allOf:
        - {$ref: '#/components/schemas/NewPlanLimits'}
        - type: object
          required: [max_forward_rules_per_node, max_subscriptions, max_routing_rules, allow_custom_lines, max_custom_lines, max_hops]
    NewPlan:
      type: object
      required: [name, quota_bytes]
      properties:
        name: {type: string, minLength: 1, maxLength: 100}
        quota_bytes: {type: integer, minimum: 0}
        default_multiplier_milli: {type: integer, minimum: 1, maximum: 100000, default: 1000}
        limits: {$ref: '#/components/schemas/NewPlanLimits'}
        resource_group_ids:
          type: array
          uniqueItems: true
          items: {type: string, format: uuid}
        line_ids:
          type: array
          uniqueItems: true
          items: {type: string, format: uuid}
    Plan:
      allOf:
        - {$ref: '#/components/schemas/NewPlan'}
        - type: object
          required: [id, billing_mode, period_months, status, default_multiplier_milli, limits, resource_group_ids, line_ids, created_at]
          properties:
            id: {type: string, format: uuid}
            billing_mode: {type: string, const: monthly_anchor}
            period_months: {type: integer, const: 1}
            status: {type: string, enum: [active, archived]}
            created_at: {type: string, format: date-time}
    PlanList:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/Plan'}
        next_cursor: {type: ['string', 'null']}
    NewMembership:
      type: object
      required: [user_id, plan_id, starts_at, ends_at, anchor_day, timezone]
      properties:
        user_id: {type: string, format: uuid}
        plan_id: {type: string, format: uuid}
        starts_at: {type: string, format: date-time}
        ends_at: {type: string, format: date-time}
        anchor_day: {type: integer, minimum: 1, maximum: 31}
        timezone: {type: string, example: Asia/Shanghai}
    EntitlementSnapshot:
      type: object
      required: [plan_name, quota_bytes, default_multiplier_milli, limits, resource_group_ids, line_ids]
      properties:
        plan_name: {type: string}
        quota_bytes: {type: integer, minimum: 0}
        default_multiplier_milli: {type: integer, minimum: 1}
        limits: {$ref: '#/components/schemas/PlanLimits'}
        resource_group_ids:
          type: array
          items: {type: string, format: uuid}
        line_ids:
          type: array
          items: {type: string, format: uuid}
    Membership:
      allOf:
        - {$ref: '#/components/schemas/NewMembership'}
        - type: object
          required: [id, status, snapshot, created_at]
          properties:
            id: {type: string, format: uuid}
            status: {type: string, const: active}
            snapshot: {$ref: '#/components/schemas/EntitlementSnapshot'}
            created_at: {type: string, format: date-time}
    NewResourceGroup:
      type: object
      required: [code, name, region]
      properties:
        code: {type: string, example: RFC.JPT1}
        name: {type: string}
        region: {type: string}
        enabled: {type: boolean, default: true}
    ResourceGroup:
      allOf:
        - {$ref: '#/components/schemas/NewResourceGroup'}
        - type: object
          required: [id, enabled, created_at]
          properties:
            id: {type: string, format: uuid}
            created_at: {type: string, format: date-time}
    ResourceGroupList:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/ResourceGroup'}
        next_cursor: {type: ['string', 'null']}
    NewNode:
      type: object
      required: [group_id, name, region, host, capabilities]
      properties:
        group_id: {type: string, format: uuid}
        name: {type: string}
        region: {type: string}
        host: {type: string}
        public_ip: {type: ['string', 'null']}
        proxy_port:
          type: ['integer', 'null']
          minimum: 1
          maximum: 65535
          description: Required when capabilities includes proxy; omitted for forward-only nodes.
        capabilities:
          type: array
          items: {type: string, enum: [proxy, forward]}
        bandwidth_bps: {type: ['integer', 'null'], minimum: 0}
        multiplier_milli: {type: integer, minimum: 1, default: 1000}
        tags:
          type: array
          items: {type: string}
        enabled: {type: boolean, default: true}
    Node:
      allOf:
        - {$ref: '#/components/schemas/NewNode'}
        - type: object
          required: [id, group_code, multiplier_milli, tags, enabled, agent_status, created_at]
          properties:
            id: {type: string, format: uuid}
            group_code: {type: string}
            agent_status: {type: string, enum: [unknown, online, offline, revoked]}
            last_seen_at: {type: ['string', 'null'], format: date-time}
            created_at: {type: string, format: date-time}
    NodeList:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/Node'}
        next_cursor: {type: ['string', 'null']}
    User:
      type: object
      required: [id, email, status, timezone, roles, permissions]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        status:
          type: string
          enum: [active, disabled]
        timezone:
          type: string
        roles:
          type: array
          items:
            type: string
        permissions:
          type: array
          items:
            type: string
    LoginResponse:
      type: object
      required: [user, csrf_token, expires_at]
      properties:
        user:
          $ref: '#/components/schemas/User'
        csrf_token:
          type: string
        expires_at:
          type: string
          format: date-time
    PermissionsResponse:
      type: object
      required: [roles, permissions]
      properties:
        roles:
          type: array
          items:
            type: string
        permissions:
          type: array
          items:
            type: string
    HealthResponse:
      type: object
      required: [status]
      properties:
        status:
          type: string
          const: ok
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, request_id]
          properties:
            code:
              type: string
            message:
              type: string
            request_id:
              type: string
