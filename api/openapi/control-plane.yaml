            application/json:
              schema: {type: object, required: [token, path], properties: {token: {type: string}, path: {type: string}}}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /api/v1/subscriptions/{id}/url:
    get:
      operationId: revealSubscriptionURL
      description: Owner-only no-store token reveal. Returns an origin-relative path, never trusts Host or Forwarded headers to build an absolute URL.
      security: [{browserSession: []}]
      parameters:
        - {in: path, name: id, required: true, schema: {type: string, format: uuid}}
        - {in: query, name: format, required: true, schema: {type: string, enum: [clash, mihomo, sing-box, surge]}}
      responses:
        '200':
          description: Subscription path; use the current configured HTTPS origin.
          content: {application/json: {schema: {type: object, required: [path], properties: {path: {type: string}}}}}
        '404': {$ref: '#/components/responses/NotFound'}
  /api/v1/subscriptions/{id}/preview:
    get:
      operationId: previewSubscription
      description: Requires subscriptions.read. Exports only currently authorized targets with online Agents and matching applied credentials. A bound routing profile must be enabled and every line action must have an available exported target. GeoSite and managed GeoIP rule-sets are expanded to portable domain and CIDR rules from the active version in the same database snapshot. Clash, Mihomo and Surge retain native GeoIP when no managed version is active; sing-box requires a managed GeoIP version. No-store response.
      security: [{browserSession: []}]
      parameters:
        - {in: path, name: id, required: true, schema: {type: string, format: uuid}}
        - {in: query, name: format, required: true, schema: {type: string, enum: [clash, mihomo, sing-box, surge]}}
      responses:
        '200':
          description: Clash/Mihomo YAML, sing-box 1.12+ JSON or Surge text profile.
          content: {application/yaml: {schema: {type: string}}, application/json: {schema: {type: object}}, text/plain: {schema: {type: string}}}
        '404': {$ref: '#/components/responses/NotFound'}
        '503': {description: SUBSCRIPTION_UNAVAILABLE; no eligible targets.}
  /sub/{token}/{format}:
    get:
      operationId: exportSubscription
      summary: Export a token-authorized profile without a browser session
      description: Mounted only when browser authentication is enabled for the deployment. Requires a valid enabled token and active owner membership. Rechecks grants, enabled resources, Agent heartbeat (45 seconds) and the currently applied credential on every request. Token paths are redacted in control-plane logs; configure upstream access logs to redact them too. No-store, no-referrer. Limited to five requests per token per five minutes and sixty globally per minute. Configure per-client IP limits at the trusted HTTPS reverse proxy; forwarded IP headers are not trusted by this service. No empty or direct-only fallback profile is returned.
      security: []
      parameters:
        - {in: path, name: token, required: true, schema: {type: string, minLength: 43, maxLength: 43}}
        - {in: path, name: format, required: true, schema: {type: string, enum: [clash, mihomo, sing-box, surge]}}
      responses:
        '200':
          description: Profile with local loopback listener, Trojan TCP and certificate verification.
          content: {application/yaml: {schema: {type: string}}, application/json: {schema: {type: object}}, text/plain: {schema: {type: string}}}
        '404': {$ref: '#/components/responses/NotFound'}
        '429': {$ref: '#/components/responses/RateLimited'}
        '503': {description: SUBSCRIPTION_UNAVAILABLE; no eligible configured targets.}
  /api/v1/routing-profiles:
    get:
      operationId: listRoutingProfiles
      security: [{browserSession: []}]
      responses:
        '200': {description: Own routing profiles, content: {application/json: {schema: {$ref: '#/components/schemas/RoutingProfilePage'}}}}
    post:
      operationId: createRoutingProfile
      security: [{browserSession: []}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/NewRoutingProfile'}}}}
      responses:
        '201': {description: Created, content: {application/json: {schema: {$ref: '#/components/schemas/RoutingProfile'}}}}
        '422': {$ref: '#/components/responses/ValidationError'}
  /api/v1/routing-profiles/{id}:
    parameters: [{in: path, name: id, required: true, schema: {type: string, format: uuid}}]
    get:
      operationId: getRoutingProfile
      security: [{browserSession: []}]
      responses: {'200': {description: Profile, content: {application/json: {schema: {$ref: '#/components/schemas/RoutingProfile'}}}}}
    patch:
      operationId: updateRoutingProfile
      security: [{browserSession: []}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/RoutingProfilePatch'}}}}
      responses: {'200': {description: Updated, content: {application/json: {schema: {$ref: '#/components/schemas/RoutingProfile'}}}}}
    delete:
      operationId: deleteRoutingProfile
      security: [{browserSession: []}]
      responses: {'204': {description: Deleted}}
  /api/v1/routing-profiles/{id}/rules:
    parameters: [{in: path, name: id, required: true, schema: {type: string, format: uuid}}]
    get:
      operationId: listRoutingRules
      security: [{browserSession: []}]
      responses: {'200': {description: Rules, content: {application/json: {schema: {$ref: '#/components/schemas/RoutingRulePage'}}}}}
    post:
      operationId: createRoutingRule
      security: [{browserSession: []}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/NewRoutingRule'}}}}
      responses: {'201': {description: Created, content: {application/json: {schema: {$ref: '#/components/schemas/RoutingRule'}}}}}
  /api/v1/routing-profiles/{id}/rules/{rule_id}:
    parameters:
      - {in: path, name: id, required: true, schema: {type: string, format: uuid}}
      - {in: path, name: rule_id, required: true, schema: {type: string, format: uuid}}
    patch:
      operationId: updateRoutingRule
      security: [{browserSession: []}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/RoutingRulePatch'}}}}
      responses: {'200': {description: Updated, content: {application/json: {schema: {$ref: '#/components/schemas/RoutingRule'}}}}}
    delete:
      operationId: deleteRoutingRule
      security: [{browserSession: []}]
      responses: {'204': {description: Deleted}}
  /api/v1/routing-profiles/{id}/validate:
    post:
      operationId: validateRoutingProfile
      security: [{browserSession: []}]
      responses: {'200': {description: Validation result, content: {application/json: {schema: {type: object, required: [valid], properties: {valid: {type: boolean}}}}}}}
  /api/v1/admin/audit:
    get:
      operationId: listAuditLogs
      summary: List recent administrator audit records
      description: Requires audit.read. Results are ordered by creation time and ID descending. The response contains metadata only; before_json and after_json snapshots are never returned.
      security: [{browserSession: []}]
      parameters:
        - {in: query, name: limit, schema: {type: integer, minimum: 1, maximum: 200, default: 100}}
        - {in: query, name: cursor, schema: {type: string, description: Opaque pagination cursor}}
      responses:
        '200': {description: Audit page, content: {application/json: {schema: {$ref: '#/components/schemas/AuditPage'}}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /api/v1/admin/routing-rule-sets:
    get:
      operationId: listManagedRuleSets
      summary: List versioned GeoSite and GeoIP rule-set metadata
      description: Requires routing_rulesets.read. Entries are not included in list responses.
      security: [{browserSession: []}]
      parameters:
        - {in: query, name: limit, schema: {type: integer, minimum: 1, maximum: 200, default: 100}}
        - {in: query, name: cursor, schema: {type: string, description: Opaque pagination cursor}}
      responses:
        '200': {description: Rule-set metadata, content: {application/json: {schema: {$ref: '#/components/schemas/ManagedRuleSetPage'}}}}
        '403': {$ref: '#/components/responses/Forbidden'}
    post:
      operationId: uploadManagedRuleSet
      summary: Upload an immutable rule-set version
      description: Requires routing_rulesets.write and CSRF. Request is limited to 8 MiB. Normalized entries are sorted, deduplicated and SHA-256 checked. An enabled upload atomically deactivates the prior version for the same kind and code.
      security: [{browserSession: []}]
      parameters: [{$ref: '#/components/parameters/CSRFToken'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/NewManagedRuleSet'}}}}
      responses:
        '201': {description: Created version, content: {application/json: {schema: {$ref: '#/components/schemas/ManagedRuleSet'}}}}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/ValidationError'}
  /api/v1/admin/routing-rule-sets/{id}:
    parameters: [{in: path, name: id, required: true, schema: {type: string, format: uuid}}]
    patch:
      operationId: setManagedRuleSetEnabled
      summary: Activate or deactivate a version
      description: Requires routing_rulesets.write and CSRF. Activation atomically deactivates the previous active version for this kind and code.
      security: [{browserSession: []}]
      parameters: [{$ref: '#/components/parameters/CSRFToken'}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [enabled]
              properties: {enabled: {type: boolean}}
      responses:
        '200': {description: Updated version, content: {application/json: {schema: {$ref: '#/components/schemas/ManagedRuleSet'}}}}
        '404': {$ref: '#/components/responses/NotFound'}
components:
  parameters:
    ForwardTargetPolicyID:
      in: path
      name: id
      required: true
      schema: {type: string, format: uuid}
    ProxyAccessID:
      in: path
      name: id
      required: true
      schema: {type: string, format: uuid}
    ForwardRuleID:
      in: path
      name: id
      required: true
      schema: {type: string, format: uuid}
    LineID:
      in: path
      name: id
      required: true
      schema: {type: string, format: uuid}
    CSRFToken:
      in: header
      name: X-CSRF-Token
      required: true
      schema: {type: string}
    PageLimit:
      in: query
      name: limit
      schema: {type: integer, minimum: 1, maximum: 200, default: 100}
    PageCursor:
      in: query
      name: cursor
      description: Opaque next_cursor value from the preceding list response.
      schema: {type: string}
  securitySchemes:
    browserSession:
      type: apiKey
      in: cookie
      name: __Host-control_session
  headers:
    RequestID:
      description: Server generated request identifier for support and logs.
      schema:
        type: string
  responses:
    BadRequest:
      description: Invalid request body.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: Missing, expired or invalid session or credentials.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: Permission denied, or CSRF token missing or invalid.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Conflict:
      description: Resource already exists.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorResponse'}
    ValidationError:
      description: Input is structurally valid JSON but has invalid fields.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorResponse'}
    RateLimited:
      description: Login rate limit reached. Retry-After gives the wait in seconds.
      headers:
        Retry-After:
          schema:
            type: integer
            minimum: 1
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    InternalError:
      description: Unexpected server error.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestID'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: Resource not found.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestID'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    DependencyUnavailable:
      description: PostgreSQL is unavailable.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestID'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  schemas:
    NewManagedRuleSet:
      type: object
      additionalProperties: false
      required: [kind, code, name, version, source, entries]
      properties:
        kind: {type: string, enum: [geosite, geoip]}
        code: {type: string, pattern: '^[a-z0-9][a-z0-9_-]{1,63}$'}
        name: {type: string, minLength: 1, maxLength: 100}
        version: {type: string, minLength: 1, maxLength: 64}
        source: {type: string, minLength: 1, maxLength: 500}
        sha256: {type: string, pattern: '^[0-9a-fA-F]{64}$', description: Optional expected SHA-256 of sorted normalized entries joined by LF.}
        entries:
          type: array
          minItems: 1
          maxItems: 10000
          description: GeoSite lines use domain:example.com or suffix:example.com; bare domains mean suffix. GeoIP lines are CIDR prefixes.
          items: {type: string}
        enabled: {type: boolean, default: true}
    ManagedRuleSet:
      type: object
      required: [id, kind, code, name, version, source, sha256, entry_count, enabled, created_at, updated_at]
      properties:
        id: {type: string, format: uuid}
        kind: {type: string, enum: [geosite, geoip]}
        code: {type: string}
        name: {type: string}
        version: {type: string}
        source: {type: string}
        sha256: {type: string}
        entry_count: {type: integer, minimum: 1}
        enabled: {type: boolean}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    ManagedRuleSetPage:
      type: object
      required: [items, next_cursor]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/ManagedRuleSet'}}
        next_cursor: {type: ['string', 'null']}
    AuditRecord:
      type: object
      required: [id, actor_user_id, actor_email, action, object_type, object_id, request_id, created_at]
      properties:
        id: {type: string, format: uuid}
        actor_user_id: {type: string, format: uuid}
        actor_email: {type: string, format: email}
        action: {type: string}
        object_type: {type: string}
        object_id: {type: string, format: uuid}
        request_id: {type: string}
        created_at: {type: string, format: date-time}
    AuditPage:
      type: object
      required: [items, next_cursor]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/AuditRecord'}}
        next_cursor: {type: ['string', 'null']}
    NewRoutingProfile:
      type: object
      additionalProperties: false
      required: [name, fallback_kind]
      properties:
        name: {type: string, minLength: 1, maxLength: 100}
        fallback_kind: {type: string, enum: [direct, block, line]}
        fallback_line_id: {type: [string, 'null'], format: uuid}
        enabled: {type: boolean, default: true}
    RoutingProfilePatch:
      type: object
      additionalProperties: false
      properties:
        name: {type: string, minLength: 1, maxLength: 100}
        fallback_kind: {type: string, enum: [direct, block, line]}
        fallback_line_id: {type: [string, 'null'], format: uuid}
        enabled: {type: boolean}
    RoutingProfile:
      allOf:
        - {$ref: '#/components/schemas/NewRoutingProfile'}
        - type: object
          required: [id, user_id, revision, created_at, updated_at]
          properties:
            id: {type: string, format: uuid}
            user_id: {type: string, format: uuid}
            revision: {type: integer, minimum: 1}
            created_at: {type: string, format: date-time}
            updated_at: {type: string, format: date-time}
    RoutingProfilePage:
      type: object
      required: [items, next_cursor]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/RoutingProfile'}}
        next_cursor: {type: ['string', 'null']}
    NewRoutingRule:
      type: object
      additionalProperties: false
      required: [priority, match_type, match_value, action]
      properties:
        priority: {type: integer, minimum: 1, maximum: 1000000}
        match_type: {type: string, enum: [domain, domain_suffix, ip, cidr, geoip, geosite]}
        match_value: {type: string, minLength: 1, maxLength: 253}
        action: {type: string, enum: [direct, block, line]}
        line_id: {type: [string, 'null'], format: uuid}
        enabled: {type: boolean, default: true}
    RoutingRulePatch:
      type: object
      additionalProperties: false
      properties:
        priority: {type: integer, minimum: 1, maximum: 1000000}
        action: {type: string, enum: [direct, block, line]}
        line_id: {type: [string, 'null'], format: uuid}
        enabled: {type: boolean}
    RoutingRule:
      allOf:
        - {$ref: '#/components/schemas/NewRoutingRule'}
        - type: object
          required: [id, profile_id, created_at, updated_at]
          properties:
            id: {type: string, format: uuid}
            profile_id: {type: string, format: uuid}
            created_at: {type: string, format: date-time}
            updated_at: {type: string, format: date-time}
    RoutingRulePage:
      type: object
      required: [items, next_cursor]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/RoutingRule'}}
        next_cursor: {type: ['string', 'null']}
    NewLine:
      type: object
      required: [name, node_id]
      additionalProperties: false
      properties:
        name: {type: string, minLength: 1, maxLength: 100}
        node_id: {type: string, format: uuid, description: 'Sole egress hop; immutable in this release.'}
        enabled: {type: boolean, default: true}
        priority: {type: integer, minimum: 0, maximum: 1000, default: 100}
        weight: {type: integer, minimum: 1, maximum: 100, default: 1}
        multiplier_milli: {type: integer, minimum: 1, maximum: 100000, description: 'Administrator shared lines only.'}
        tags:
          type: array
          maxItems: 16
          uniqueItems: true
          items: {type: string, minLength: 1, maxLength: 32}
    LinePatch:
      type: object
      minProperties: 1
      additionalProperties: false
      properties:
        name: {type: string, minLength: 1, maxLength: 100}
        enabled: {type: boolean}
        priority: {type: integer, minimum: 0, maximum: 1000}
        weight: {type: integer, minimum: 1, maximum: 100}
        multiplier_milli: {type: integer, minimum: 1, maximum: 100000, description: 'Administrator shared lines only.'}
        tags:
          type: array
          maxItems: 16
          uniqueItems: true
          items: {type: string, minLength: 1, maxLength: 32}
    LineHop:
      type: object
      required: [position, node_id, role]
      properties:
        position: {type: integer, const: 0}
        node_id: {type: string, format: uuid}
        role: {type: string, const: egress}
    Line:
      type: object
      required: [id, owner_user_id, name, enabled, priority, weight, multiplier_milli, tags, hops, created_at, updated_at]
      properties:
        id: {type: string, format: uuid}
        owner_user_id: {type: ['string', 'null'], format: uuid}
        name: {type: string}
        enabled: {type: boolean}
        priority: {type: integer}
        weight: {type: integer}
        multiplier_milli: {type: ['integer', 'null']}
        tags:
          type: array
          items: {type: string}
        hops:
          type: array
          minItems: 1
          maxItems: 1
          items: {$ref: '#/components/schemas/LineHop'}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    LineList:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/Line'}
        next_cursor: {type: ['string', 'null']}
    NewForwardTargetPolicy:
      type: object
      required: [kind, protocol, port_start, port_end]
      additionalProperties: false
      properties:
        kind: {type: string, enum: [public_host, node]}
        target_group_id: {type: string, format: uuid, description: 'Required for node policies; forbidden for public_host.'}
        protocol: {type: string, enum: [TCP, UDP]}
        port_start: {type: integer, minimum: 1, maximum: 65535}
        port_end: {type: integer, minimum: 1, maximum: 65535}
        enabled: {type: boolean, default: true}
    ForwardTargetPolicyPatch:
      type: object
      required: [enabled]
      additionalProperties: false
      properties:
        enabled: {type: boolean}
    ForwardTargetPolicy:
      type: object
      required: [id, kind, target_group_id, protocol, port_start, port_end, enabled, created_at, updated_at]
      properties:
        id: {type: string, format: uuid}
        kind: {type: string, enum: [public_host, node]}
        target_group_id: {type: ['string', 'null'], format: uuid}
        protocol: {type: string, enum: [TCP, UDP]}
        port_start: {type: integer}
        port_end: {type: integer}
        enabled: {type: boolean}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    ForwardTargetPolicyList:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/ForwardTargetPolicy'}
        next_cursor: {type: ['string', 'null']}
    NewProxyAccess:
      type: object
      additionalProperties: false
      required: [name, line_id]
      properties:
        name: {type: string, minLength: 1, maxLength: 100}
        line_id: {type: string, format: uuid}
        enabled: {type: boolean, default: true}
    ProxyAccessPatch:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name: {type: string, minLength: 1, maxLength: 100}
        enabled: {type: boolean}
    ProxyAccess:
      type: object
      required: [id, user_id, line_id, name, enabled, apply_status, created_at, updated_at]
      properties:
        id: {type: string, format: uuid}
        user_id: {type: string, format: uuid}
        line_id: {type: string, format: uuid}
        name: {type: string}
        enabled: {type: boolean}
        apply_status: {type: string, enum: [pending, active, apply_failed, disabled]}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    ProxyAccessList:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/ProxyAccess'}
        next_cursor: {type: ['string', 'null']}
    ProxyAccessCreated:
      type: object
      required: [access, credential]
      properties:
        access: {$ref: '#/components/schemas/ProxyAccess'}
        credential: {type: string, description: High entropy generated Trojan password.}
    ProxyCredential:
      type: object
      required: [credential]
      properties:
        credential: {type: string}
    NewForwardRule:
      type: object
      required: [name, ingress_node_id, ingress_port, target_port, protocol]
      additionalProperties: false
      oneOf:
        - required: [target_node_id]
          not: {required: [target_host]}
        - required: [target_host]
          not: {required: [target_node_id]}
      properties:
        name: {type: string, minLength: 1, maxLength: 100}
        ingress_node_id: {type: string, format: uuid}
        ingress_port: {type: integer, minimum: 1024, maximum: 65535}
        target_node_id: {type: string, format: uuid}
        target_host: {type: string, description: 'Public IP literal or DNS hostname; resolved addresses must be checked by the Agent.'}
        target_port: {type: integer, minimum: 1, maximum: 65535}
        protocol: {type: string, enum: [TCP, UDP, BOTH]}
        enabled: {type: boolean, default: true}
    ForwardRulePatch:
      type: object
      minProperties: 1
      additionalProperties: false
      properties:
        name: {type: string, minLength: 1, maxLength: 100}
        enabled: {type: boolean}
    ForwardRule:
      type: object
      required: [id, user_id, name, ingress_node_id, ingress_port, target_node_id, target_host, target_port, line_id, protocol, enabled, apply_status, created_at, updated_at]
      properties:
        id: {type: string, format: uuid}
        user_id: {type: string, format: uuid}
        name: {type: string}
        ingress_node_id: {type: string, format: uuid}
        ingress_port: {type: integer}
        target_node_id: {type: ['string', 'null'], format: uuid}
        target_host: {type: ['string', 'null']}
        target_port: {type: integer}
        line_id: {type: ['string', 'null'], format: uuid, description: 'Always null in the direct-only release.'}
        protocol: {type: string, enum: [TCP, UDP, BOTH]}
        enabled: {type: boolean}
        apply_status: {type: string, enum: [pending, active, apply_failed, disabled]}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    ForwardRuleList:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/ForwardRule'}
        next_cursor: {type: ['string', 'null']}
    NewUser:
      type: object
      required: [email, password]
      additionalProperties: false
      properties:
        email: {type: string, format: email, maxLength: 254}
        password: {type: string, writeOnly: true, description: '12 to 72 UTF-8 bytes.'}
        timezone: {type: string, default: Asia/Shanghai}
    PasswordChange:
      type: object
      required: [old_password, new_password]
      additionalProperties: false
      properties:
        old_password: {type: string, writeOnly: true}
        new_password: {type: string, writeOnly: true, description: '12 to 72 UTF-8 bytes; must differ from the old password.'}
    UserList:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/User'}
        next_cursor: {type: ['string', 'null']}
    NewPlanLimits:
      type: object
      properties:
        max_forward_rules_per_node: {type: integer, minimum: 0, default: 0}
        max_subscriptions: {type: integer, minimum: 0, default: 0}
        max_routing_rules: {type: integer, minimum: 0, default: 0}
        allow_custom_lines: {type: boolean, default: false}
        max_custom_lines: {type: integer, minimum: 0, default: 0}
        max_hops: {type: integer, const: 1, default: 1}
    PlanLimits:
      allOf:
        - {$ref: '#/components/schemas/NewPlanLimits'}
        - type: object
          required: [max_forward_rules_per_node, max_subscriptions, max_routing_rules, allow_custom_lines, max_custom_lines, max_hops]
    NewPlan:
      type: object
      required: [name, quota_bytes]
      properties:
        name: {type: string, minLength: 1, maxLength: 100}
        quota_bytes: {type: integer, minimum: 0}
        default_multiplier_milli: {type: integer, minimum: 1, maximum: 100000, default: 1000}
        limits: {$ref: '#/components/schemas/NewPlanLimits'}
        resource_group_ids:
          type: array
          uniqueItems: true
          items: {type: string, format: uuid}
        line_ids:
          type: array
          uniqueItems: true
          items: {type: string, format: uuid}
    Plan:
      allOf:
        - {$ref: '#/components/schemas/NewPlan'}
        - type: object
          required: [id, billing_mode, period_months, status, default_multiplier_milli, limits, resource_group_ids, line_ids, created_at]
          properties:
            id: {type: string, format: uuid}
            billing_mode: {type: string, const: monthly_anchor}
            period_months: {type: integer, const: 1}
            status: {type: string, enum: [active, archived]}
            created_at: {type: string, format: date-time}
    PlanList:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/Plan'}
        next_cursor: {type: ['string', 'null']}
    NewMembership:
      type: object
      required: [user_id, plan_id, starts_at, ends_at, anchor_day, timezone]
      properties:
        user_id: {type: string, format: uuid}
        plan_id: {type: string, format: uuid}
        starts_at: {type: string, format: date-time}
        ends_at: {type: string, format: date-time}
        anchor_day: {type: integer, minimum: 1, maximum: 31}
        timezone: {type: string, example: Asia/Shanghai}
    EntitlementSnapshot:
      type: object
      required: [plan_name, quota_bytes, default_multiplier_milli, limits, resource_group_ids, line_ids]
      properties:
        plan_name: {type: string}
        quota_bytes: {type: integer, minimum: 0}
        default_multiplier_milli: {type: integer, minimum: 1}
        limits: {$ref: '#/components/schemas/PlanLimits'}
        resource_group_ids:
          type: array
          items: {type: string, format: uuid}
        line_ids:
          type: array
          items: {type: string, format: uuid}
    UsageOverview:
      type: object
      required: [period_id, membership_id, membership_ends_at, starts_at, ends_at, quota_bytes, uploaded_bytes, downloaded_bytes, charged_bytes, reserved_bytes, remaining_bytes, available_bytes, usage_percent, snapshot]
      properties:
        period_id: {type: string, format: uuid}
        membership_id: {type: string, format: uuid}
        membership_ends_at: {type: string, format: date-time}
        starts_at: {type: string, format: date-time}
        ends_at: {type: string, format: date-time, description: Next quota reset time.}
        quota_bytes: {type: integer, minimum: 0}
        uploaded_bytes: {type: integer, minimum: 0}
        downloaded_bytes: {type: integer, minimum: 0}
        charged_bytes: {type: integer, minimum: 0}
        reserved_bytes: {type: integer, minimum: 0}
        remaining_bytes: {type: integer, minimum: 0}
        available_bytes: {type: integer, minimum: 0}
        usage_percent: {type: number, minimum: 0, maximum: 100}
        snapshot: {$ref: '#/components/schemas/EntitlementSnapshot'}
    DailyUsage:
      type: object
      required: [date, uploaded_bytes, downloaded_bytes, charged_bytes]
      properties:
        date: {type: string, format: date, description: UTC date.}
        uploaded_bytes: {type: integer, minimum: 0}
        downloaded_bytes: {type: integer, minimum: 0}
        charged_bytes: {type: integer, minimum: 0}
    UsageBucket:
      type: object
      required: [date, dimension_id, uploaded_bytes, downloaded_bytes, charged_bytes]
      properties:
        date: {type: string, format: date, description: UTC date.}
        dimension_id: {type: string, description: UUID for selected group or empty for date-only and unattributed lines.}
        uploaded_bytes: {type: integer, minimum: 0}
        downloaded_bytes: {type: integer, minimum: 0}
        charged_bytes: {type: integer, minimum: 0}
    Membership:
      allOf:
        - {$ref: '#/components/schemas/NewMembership'}
        - type: object
          required: [id, status, snapshot, created_at]
          properties:
            id: {type: string, format: uuid}
            status: {type: string, const: active}
            snapshot: {$ref: '#/components/schemas/EntitlementSnapshot'}
            created_at: {type: string, format: date-time}
    NewResourceGroup:
      type: object
      required: [code, name, region]
      properties:
        code: {type: string, example: RFC.JPT1}
        name: {type: string}
        region: {type: string}
        enabled: {type: boolean, default: true}
    ResourceGroup:
      allOf:
        - {$ref: '#/components/schemas/NewResourceGroup'}
        - type: object
          required: [id, enabled, created_at]
          properties:
            id: {type: string, format: uuid}
            created_at: {type: string, format: date-time}
    ResourceGroupList:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/ResourceGroup'}
        next_cursor: {type: ['string', 'null']}
    NewNode:
      type: object
      required: [group_id, name, region, host, capabilities]
      properties:
        group_id: {type: string, format: uuid}
        name: {type: string}
        region: {type: string}
        host: {type: string}
        public_ip: {type: ['string', 'null']}
        proxy_port:
          type: ['integer', 'null']
          minimum: 1
          maximum: 65535
          description: Required when capabilities includes proxy; omitted for forward-only nodes.
        capabilities:
          type: array
          items: {type: string, enum: [proxy, forward]}
        bandwidth_bps: {type: ['integer', 'null'], minimum: 0}
        multiplier_milli: {type: integer, minimum: 1, default: 1000}
        tags:
          type: array
          items: {type: string}
        enabled: {type: boolean, default: true}
    Node:
      allOf:
        - {$ref: '#/components/schemas/NewNode'}
        - type: object
          required: [id, group_code, multiplier_milli, tags, enabled, agent_status, created_at]
          properties:
            id: {type: string, format: uuid}
            group_code: {type: string}
            agent_status: {type: string, enum: [unknown, online, offline, revoked]}
            last_seen_at: {type: ['string', 'null'], format: date-time}
            created_at: {type: string, format: date-time}
    NodeList:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/Node'}
        next_cursor: {type: ['string', 'null']}
    NodeMetrics:
      type: object
      required: [node_id, agent_status, last_seen_at, fresh, metrics]
      properties:
        node_id: {type: string, format: uuid}
        agent_status: {type: string, enum: [unknown, online, offline, revoked]}
        last_seen_at: {type: ['string', 'null'], format: date-time}
        fresh: {type: boolean}
        metrics:
          oneOf:
            - type: 'null'
            - $ref: '#/components/schemas/AgentMetrics'
    AgentMetrics:
      type: object
      required: [observed_at, uptime_seconds, cpu_pct, memory_used_bytes, rx_bytes, tx_bytes, connections, engine_status]
      properties:
        observed_at: {type: string, format: date-time}
        uptime_seconds: {type: integer, format: int64, minimum: 0}
        cpu_pct: {type: number, minimum: 0, maximum: 100}
        memory_used_bytes: {type: integer, format: int64, minimum: 0}
        rx_bytes: {type: integer, format: int64, minimum: 0}
        tx_bytes: {type: integer, format: int64, minimum: 0}
        connections: {type: integer, format: int64, minimum: 0}
        engine_status: {type: string, enum: [running, degraded, stopped]}
    User:
      type: object
      required: [id, email, status, timezone, roles, permissions]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        status:
          type: string
          enum: [active, disabled]
        timezone:
          type: string
        roles:
          type: array
          items:
            type: string
        permissions:
          type: array
          items:
            type: string
    PermissionCatalogItem:
      type: object
      required: [code, description]
      properties:
        code: {type: string}
        description: {type: string}
    Role:
      type: object
      required: [id, code, description, system, permissions, member_count]
      properties:
        id: {type: string, format: uuid}
        code: {type: string}
        description: {type: string}
        system: {type: boolean}
        permissions: {type: array, items: {type: string}}
        member_count: {type: integer, minimum: 0}
    RoleDirectory:
      type: object
      required: [roles, permissions]
      properties:
        roles: {type: array, items: {$ref: '#/components/schemas/Role'}}
        permissions: {type: array, items: {$ref: '#/components/schemas/PermissionCatalogItem'}}
    NewRole:
      type: object
      additionalProperties: false
      required: [code, description, permissions]
      properties:
        code: {type: string, pattern: '^[a-z][a-z0-9_-]{1,31}$'}
        description: {type: string, minLength: 1, maxLength: 200}
        permissions: {type: array, maxItems: 64, uniqueItems: true, items: {type: string}}
    RolePatch:
      type: object
      additionalProperties: false
      properties:
        description: {type: string, minLength: 1, maxLength: 200}
        permissions: {type: array, maxItems: 64, uniqueItems: true, items: {type: string}}
    LoginResponse:
      type: object
      required: [user, csrf_token, expires_at]
      properties:
        user:
          $ref: '#/components/schemas/User'
        csrf_token:
          type: string
        expires_at:
          type: string
          format: date-time
    PermissionsResponse:
      type: object
      required: [roles, permissions]
      properties:
        roles:
          type: array
          items:
            type: string
        permissions:
          type: array
          items:
            type: string
    HealthResponse:
      type: object
      required: [status]
      properties:
        status:
          type: string
          const: ok
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, request_id]
          properties:
            code:
              type: string
            message:
              type: string
            request_id:
              type: string
    NewSubscription:
      type: object
      additionalProperties: false
      required: [name, proxy_access_ids]
      properties:
        name: {type: string, minLength: 1, maxLength: 100}
        name_template: {type: string, maxLength: 200, default: '{region} · {name}', description: 'Supports {name}, {line}, {region}, {index}.'}
        enabled: {type: boolean, default: true}
        routing_profile_id: {type: [string, 'null'], format: uuid, description: 'Optional enabled routing profile owned by this user. Its line actions must have an available proxy target in this subscription at export time.'}
        proxy_access_ids: {type: array, minItems: 1, maxItems: 100, uniqueItems: true, items: {type: string, format: uuid}}
    SubscriptionPatch:
      type: object
      additionalProperties: false
      properties:
        name: {type: string, minLength: 1, maxLength: 100}
        name_template: {type: string, maxLength: 200}
        enabled: {type: boolean}
        routing_profile_id: {type: [string, 'null'], format: uuid, description: 'Set a routing profile or null to restore the default proxy route.'}
        proxy_access_ids: {type: array, minItems: 1, maxItems: 100, uniqueItems: true, items: {type: string, format: uuid}}
    Subscription:
      type: object
      required: [id, user_id, name, name_template, enabled, proxy_access_ids, created_at, updated_at]
      properties:
        id: {type: string, format: uuid}
        user_id: {type: string, format: uuid}
        name: {type: string}
        name_template: {type: string}
        enabled: {type: boolean}
        routing_profile_id: {type: [string, 'null'], format: uuid}
        proxy_access_ids: {type: array, items: {type: string, format: uuid}}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
