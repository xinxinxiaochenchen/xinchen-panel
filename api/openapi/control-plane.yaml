openapi: 3.1.0
info:
  title: Network Control Plane API
  version: 0.1.0
  description: Health, browser identity, user lifecycle, resource directory, entitlement, single-hop line, proxy access, direct forwarding and Agent enrollment contracts for the independently designed network control plane. Browser identity and Agent enrollment require HTTPS.
servers:
  - url: http://127.0.0.1:8080
paths:
  /api/v1/admin/nodes/{id}/agent-enrollment:
    post:
      operationId: createAgentEnrollmentToken
      summary: Issue a ten-minute one-time enrollment token for a node
      description: Requires an administrator browser session with agents.write, CSRF and current password reauthentication. Available only when Agent TLS is configured; the public HTTP preview keeps browser authentication disabled. Issuing another token for the same node revokes its previous unused token. The action is audited without storing the token; the token appears only in this response.
      security: [{browserSession: []}]
      parameters:
        - in: path
          name: id
          required: true
          schema: {type: string, format: uuid}
        - {$ref: '#/components/parameters/CSRFToken'}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [password]
              properties:
                password: {type: string, format: password}
      responses:
        '201':
          description: One-time Agent enrollment token.
          content:
            application/json:
              schema:
                type: object
                required: [token, expires_at]
                properties:
                  token: {type: string}
                  expires_at: {type: string, format: date-time}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '429': {$ref: '#/components/responses/RateLimited'}
        '500': {$ref: '#/components/responses/InternalError'}
  /api/v1/agent/enroll:
    post:
      operationId: enrollAgent
      summary: Exchange a one-time Agent token and Ed25519 CSR for a client certificate
      description: Served only by the dedicated TLS Agent listener when configured. The public HTTP preview does not mount this endpoint. The token is valid for 10 minutes and consumed once. The private key remains on the Agent. The server certificate must be trusted and cover the address used by the Agent.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [token, csr_pem, version]
              properties:
                token: {type: string, description: One-time bearer token issued for an existing node.}
                csr_pem: {type: string, description: PEM encoded PKCS#10 Ed25519 certificate request.}
                version: {type: string, description: Agent software version.}
      responses:
        '201':
          description: Short-lived client certificate bound to the enrolled node.
          content:
            application/json:
              schema:
                type: object
                required: [node_id, certificate_pem, ca_certificate_pem, expires_at]
                properties:
                  node_id: {type: string, format: uuid}
                  certificate_pem: {type: string}
                  ca_certificate_pem: {type: string}
                  expires_at: {type: string, format: date-time}
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429': {$ref: '#/components/responses/RateLimited'}
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/agent/renew:
    post:
      operationId: renewAgentCertificate
      summary: Renew an Agent client certificate using the current mTLS identity
      description: Dedicated Agent TLS listener only. Requires a CA-verified, database-authorized Agent certificate with at most six hours remaining. The signed Ed25519 CSR must use the current certificate key. Retries using the same parent certificate return the same certificate. Re-enrollment or revocation invalidates renewal grants.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [csr_pem, version]
              properties:
                csr_pem: {type: string, description: PEM encoded same-key Ed25519 CSR.}
                version: {type: string, description: Agent software version.}
      responses:
        '200':
          description: New Agent certificate with 24 hour validity.
          content:
            application/json:
              schema:
                type: object
                required: [node_id, certificate_pem, ca_certificate_pem, expires_at]
                properties:
                  node_id: {type: string, format: uuid}
                  certificate_pem: {type: string}
                  ca_certificate_pem: {type: string}
                  expires_at: {type: string, format: date-time}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '409': {$ref: '#/components/responses/Conflict'}
        '429': {$ref: '#/components/responses/RateLimited'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/DependencyUnavailable'}
  /api/v1/agent/stream:
    get:
      operationId: connectAgentStream
      summary: Upgrade an authenticated Agent connection to WebSocket
      description: Dedicated TLS listener only. Requires a CA-verified client certificate whose node URI and current database fingerprint match. The first JSON frame must be a node-bound hello. Subsequent Agent frames include heartbeat, config_result, usage, quota and certificate_update. A certificate_update contains a same-key renewed certificate authorized for the same node; the server replies with certificate_update_ack containing its SHA-256 fingerprint and then uses it for periodic authorization checks on this connection. The control plane sends complete config_snapshot frames. Frames are limited to 1 MiB. The public HTTP preview does not expose this endpoint.
      responses:
        '101':
          description: Agent WebSocket connection established.
        '401': {$ref: '#/components/responses/Unauthorized'}
        '503': {$ref: '#/components/responses/DependencyUnavailable'}
  /api/v1/health/live:
    get:
      operationId: getLiveness
      summary: Process liveness
      responses:
        '200':
          description: The HTTP process can serve requests.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/health/ready:
    get:
      operationId: getReadiness
      summary: Initial process readiness
      description: Checks the PostgreSQL connection with a two-second timeout.
      responses:
        '200':
          description: The process is ready to serve current endpoints.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/DependencyUnavailable'
  /api/v1/auth/login:
    post:
      operationId: login
      summary: Create a browser session
      description: Requires HTTPS. Sets a Secure HttpOnly session cookie and a readable CSRF cookie.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              additionalProperties: false
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
      responses:
        '200':
          description: Authenticated browser session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/auth/logout:
    post:
      operationId: logout
      summary: Revoke the current browser session
      security:
        - browserSession: []
      parameters:
        - in: header
          name: X-CSRF-Token
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Session revoked and cookies cleared
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/me:
    get:
      operationId: getCurrentUser
      summary: Get the current account
      security:
        - browserSession: []
      responses:
        '200':
          description: Current account and effective permissions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v1/me/permissions:
    get:
      operationId: getCurrentPermissions
      summary: Get effective role and permission codes
      security:
        - browserSession: []
      responses:
        '200':
          description: Effective roles and permissions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PermissionsResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v1/me/password:
    post:
      operationId: changeMyPassword
      summary: Change the authenticated user's password and revoke all sessions
      security: [{browserSession: []}]
      parameters:
        - in: header
          name: X-CSRF-Token
          required: true
          schema: {type: string}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/PasswordChange'}
      responses:
        '204':
          description: Password changed; all browser sessions revoked and cookies cleared.
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '422': {$ref: '#/components/responses/ValidationError'}
        '429': {$ref: '#/components/responses/RateLimited'}
  /api/v1/admin/users:
    get:
      operationId: listUsers
      summary: List users (administrator)
      security: [{browserSession: []}]
      parameters:
        - {$ref: '#/components/parameters/PageLimit'}
        - {$ref: '#/components/parameters/PageCursor'}
      responses:
        '200':
          description: Users
          content:
            application/json:
              schema: {$ref: '#/components/schemas/UserList'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
    post:
      operationId: createUser
      summary: Create an active normal user (administrator)
      description: Set an initial password over HTTPS and share it with the user through an approved channel. The response and audit log omit the password.
      security: [{browserSession: []}]
      parameters:
        - in: header
          name: X-CSRF-Token
          required: true
          schema: {type: string}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/NewUser'}
      responses:
        '201':
          description: Created user without password material
          content:
            application/json:
              schema: {$ref: '#/components/schemas/User'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/ValidationError'}
  /api/v1/admin/users/{id}:
    patch:
      operationId: setUserStatus
      summary: Disable or restore a normal user (administrator)
      description: Disabling revokes browser sessions and schedules Agent configuration convergence. Administrator accounts cannot be changed here.
      security: [{browserSession: []}]
      parameters:
        - in: path
          name: id
          required: true
          schema: {type: string, format: uuid}
        - in: header
          name: X-CSRF-Token
          required: true
          schema: {type: string}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [status]
              properties:
                status: {type: string, enum: [active, disabled]}
      responses:
        '200':
          description: Updated user
          content:
            application/json:
              schema: {$ref: '#/components/schemas/User'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422': {$ref: '#/components/responses/ValidationError'}
  /api/v1/admin/users/{id}/roles:
    put:
      operationId: replaceUserCustomRoles
      summary: Replace a normal user's custom roles while preserving the system user role
      description: Requires the system administrator role, roles.write and CSRF. Administrator accounts and the acting user's own account cannot be changed. Existing sessions observe the new permission union on their next request.
      security: [{browserSession: []}]
      parameters:
        - in: path
          name: id
          required: true
          schema: {type: string, format: uuid}
        - {$ref: '#/components/parameters/CSRFToken'}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [role_codes]
              properties:
                role_codes: {type: array, maxItems: 32, uniqueItems: true, items: {type: string}}
      responses:
        '200':
          description: Updated user
          content:
            application/json:
              schema: {$ref: '#/components/schemas/User'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422': {$ref: '#/components/responses/ValidationError'}
  /api/v1/admin/roles:
    get:
      operationId: listRolesAndPermissions
      summary: List system and custom roles and the permission catalog
      description: Requires roles.read.
      security: [{browserSession: []}]
      responses:
        '200':
          description: Role directory
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RoleDirectory'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
    post:
      operationId: createCustomRole
      summary: Create a custom role
      description: Requires the system administrator role, roles.write and CSRF. A custom role cannot contain roles.write.
      security: [{browserSession: []}]
      parameters:
        - {$ref: '#/components/parameters/CSRFToken'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/NewRole'}
      responses:
        '201':
          description: Created role
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Role'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/ValidationError'}
  /api/v1/admin/roles/{code}:
    patch:
      operationId: updateCustomRole
      summary: Replace a custom role's permission set or description
      description: Requires the system administrator role, roles.write and CSRF. System roles cannot be changed and custom roles cannot contain roles.write.
      security: [{browserSession: []}]
      parameters:
        - {in: path, name: code, required: true, schema: {type: string}}
        - {$ref: '#/components/parameters/CSRFToken'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/RolePatch'}
      responses:
        '200':
          description: Updated role
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Role'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422': {$ref: '#/components/responses/ValidationError'}
    delete:
      operationId: deleteCustomRole
      summary: Delete an unassigned custom role
      description: Requires the system administrator role, roles.write and CSRF. System roles and assigned custom roles cannot be deleted.
      security: [{browserSession: []}]
      parameters:
        - {in: path, name: code, required: true, schema: {type: string}}
        - {$ref: '#/components/parameters/CSRFToken'}
      responses:
        '204': {description: Role deleted}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/ValidationError'}
  /api/v1/admin/plans:
    get:
      operationId: listPlans
      summary: List plans (administrator)
      security: [{browserSession: []}]
      parameters:
        - {$ref: '#/components/parameters/PageLimit'}
        - {$ref: '#/components/parameters/PageCursor'}
      responses:
        '200':
          description: Plans
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PlanList'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
    post:
      operationId: createPlan
      summary: Create an active plan with explicit grants (administrator)
      security: [{browserSession: []}]
      parameters:
        - in: header
          name: X-CSRF-Token
          required: true
          schema: {type: string}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/NewPlan'}
      responses:
        '201':
          description: Created plan
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Plan'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/ValidationError'}
  /api/v1/admin/memberships:
    post:
      operationId: createMembership
      summary: Assign an immediately active membership (administrator)
      description: Copies current plan grants and limits to an immutable membership snapshot.
      security: [{browserSession: []}]
      parameters:
        - in: header
          name: X-CSRF-Token
          required: true
          schema: {type: string}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/NewMembership'}
      responses:
        '201':
          description: Created active membership
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Membership'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/ValidationError'}
  /api/v1/my/membership:
    get:
      operationId: getMyMembership
      summary: Get the authenticated user's current membership
      security: [{browserSession: []}]
      responses:
        '200':
          description: Current membership
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Membership'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /api/v1/my/entitlements:
    get:
      operationId: getMyEntitlements
      summary: Get the authenticated user's frozen current plan entitlements
      security: [{browserSession: []}]
      responses:
        '200':
          description: Current membership snapshot
          content:
            application/json:
              schema: {$ref: '#/components/schemas/EntitlementSnapshot'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /api/v1/my/usage/current:
    get:
      operationId: getMyCurrentUsage
      summary: Get the authenticated user's current billing period and quota
      description: Requires dashboard.read. Remaining bytes exclude charged usage; available bytes additionally exclude active lease reservations that may contain unreported traffic. Usage percentage is capped at 100.
      security: [{browserSession: []}]
      responses:
        '200':
          description: Current frozen billing period overview
          content:
            application/json:
              schema: {$ref: '#/components/schemas/UsageOverview'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '500': {$ref: '#/components/responses/InternalError'}
  /api/v1/my/usage/daily:
    get:
      operationId: listMyDailyUsage
      summary: List the authenticated user's UTC daily usage
      description: Requires usage.read. Both date parameters are inclusive. Maximum span is 90 UTC days. Missing days have no row.
      security: [{browserSession: []}]
      parameters:
        - in: query
          name: from
          required: true
          schema: {type: string, format: date}
        - in: query
          name: to
          required: true
          schema: {type: string, format: date}
      responses:
        '200':
          description: Daily raw and billed usage
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: {$ref: '#/components/schemas/DailyUsage'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '500': {$ref: '#/components/responses/InternalError'}
  /api/v1/admin/usage/daily:
    get:
      operationId: listAdminDailyUsage
      summary: List daily usage grouped by date, user, ingress node or line
      description: Requires usage.admin. Dates use UTC and are inclusive. Maximum span is 90 days. Optional IDs narrow the event set before grouping. Empty dimension_id represents usage without a line. Results use a stable date and dimension cursor.
      security: [{browserSession: []}]
      parameters:
        - in: query
          name: from
          required: true
          schema: {type: string, format: date}
        - in: query
          name: to
          required: true
          schema: {type: string, format: date}
        - in: query
          name: group_by
          required: true
          schema: {type: string, enum: [date, user, node, line]}
        - in: query
          name: user_id
          schema: {type: string, format: uuid}
        - in: query
          name: node_id
          schema: {type: string, format: uuid}
        - in: query
          name: line_id
          schema: {type: string, format: uuid}
        - {$ref: '#/components/parameters/PageLimit'}
        - {$ref: '#/components/parameters/PageCursor'}
      responses:
        '200':
          description: Usage buckets and next cursor
          content:
            application/json:
              schema:
                type: object
                required: [items, next_cursor]
                properties:
                  items:
                    type: array
                    items: {$ref: '#/components/schemas/UsageBucket'}
                  next_cursor: {type: ['string', 'null']}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '500': {$ref: '#/components/responses/InternalError'}
  /api/v1/admin/resource-groups:
    get:
      operationId: listResourceGroups
      summary: List all resource groups (administrator)
      description: Requires nodes.write or forward_policies.write. The latter can list group identifiers for node destination policies but cannot create groups.
      security: [{browserSession: []}]
      parameters:
        - {$ref: '#/components/parameters/PageLimit'}
        - {$ref: '#/components/parameters/PageCursor'}
      responses:
        '200':
          description: Resource groups
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResourceGroupList'
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
    post:
      operationId: createResourceGroup
      summary: Create a resource group (administrator)
      security: [{browserSession: []}]
      parameters:
        - in: header
          name: X-CSRF-Token
          required: true
          schema: {type: string}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/NewResourceGroup'}
      responses:
        '201':
          description: Created group
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ResourceGroup'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/ValidationError'}
  /api/v1/admin/nodes:
    get:
      operationId: listAllNodes
      summary: List all nodes (administrator)
      description: Requires nodes.write or agents.write. The latter grants node visibility for Agent enrollment but not node creation.
      security: [{browserSession: []}]
      parameters:
        - {$ref: '#/components/parameters/PageLimit'}
        - {$ref: '#/components/parameters/PageCursor'}
      responses:
        '200':
          description: All nodes
          content:
            application/json:
              schema: {$ref: '#/components/schemas/NodeList'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
    post:
      operationId: createNode
