openapi: 3.1.0
info:
  title: Network Control Plane API
  version: 0.1.0
  description: Health, browser identity and resource directory endpoints for the independently designed network control plane. Browser identity requires HTTPS.
servers:
  - url: http://127.0.0.1:8080
paths:
  /api/v1/health/live:
    get:
      operationId: getLiveness
      summary: Process liveness
      responses:
        '200':
          description: The HTTP process can serve requests.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/health/ready:
    get:
      operationId: getReadiness
      summary: Initial process readiness
      description: Checks the PostgreSQL connection with a two-second timeout.
      responses:
        '200':
          description: The process is ready to serve current endpoints.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/DependencyUnavailable'
  /api/v1/auth/login:
    post:
      operationId: login
      summary: Create a browser session
      description: Requires HTTPS. Sets a Secure HttpOnly session cookie and a readable CSRF cookie.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              additionalProperties: false
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
      responses:
        '200':
          description: Authenticated browser session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/auth/logout:
    post:
      operationId: logout
      summary: Revoke the current browser session
      security:
        - browserSession: []
      parameters:
        - in: header
          name: X-CSRF-Token
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Session revoked and cookies cleared
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/me:
    get:
      operationId: getCurrentUser
      summary: Get the current account
      security:
        - browserSession: []
      responses:
        '200':
          description: Current account and effective permissions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v1/me/permissions:
    get:
      operationId: getCurrentPermissions
      summary: Get effective role and permission codes
      security:
        - browserSession: []
      responses:
        '200':
          description: Effective roles and permissions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PermissionsResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v1/admin/resource-groups:
    get:
      operationId: listResourceGroups
      summary: List all resource groups (administrator)
      security: [{browserSession: []}]
      parameters:
        - {$ref: '#/components/parameters/PageLimit'}
        - {$ref: '#/components/parameters/PageCursor'}
      responses:
        '200':
          description: Resource groups
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResourceGroupList'
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
    post:
      operationId: createResourceGroup
      summary: Create a resource group (administrator)
      security: [{browserSession: []}]
      parameters:
        - in: header
          name: X-CSRF-Token
          required: true
          schema: {type: string}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/NewResourceGroup'}
      responses:
        '201':
          description: Created group
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ResourceGroup'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/ValidationError'}
  /api/v1/admin/nodes:
    get:
      operationId: listAllNodes
      summary: List all nodes (administrator)
      security: [{browserSession: []}]
      parameters:
        - {$ref: '#/components/parameters/PageLimit'}
        - {$ref: '#/components/parameters/PageCursor'}
      responses:
        '200':
          description: All nodes
          content:
            application/json:
              schema: {$ref: '#/components/schemas/NodeList'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
    post:
      operationId: createNode
      summary: Create a node (administrator)
      security: [{browserSession: []}]
      parameters:
        - in: header
          name: X-CSRF-Token
          required: true
          schema: {type: string}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/NewNode'}
      responses:
        '201':
          description: Created node
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Node'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/ValidationError'}
  /api/v1/nodes:
    get:
      operationId: listAllowedNodes
      summary: List nodes allowed by the active membership snapshot
      security: [{browserSession: []}]
      parameters:
        - {$ref: '#/components/parameters/PageLimit'}
        - {$ref: '#/components/parameters/PageCursor'}
      responses:
        '200':
          description: Authorized and enabled nodes
          content:
            application/json:
              schema: {$ref: '#/components/schemas/NodeList'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /api/v1/nodes/{id}:
    get:
      operationId: getAllowedNode
      summary: Get an authorized node
      security: [{browserSession: []}]
      parameters:
        - in: path
          name: id
          required: true
          schema: {type: string, format: uuid}
      responses:
        '200':
          description: Authorized node
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Node'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
components:
  parameters:
    PageLimit:
      in: query
      name: limit
      schema: {type: integer, minimum: 1, maximum: 200, default: 100}
    PageCursor:
      in: query
      name: cursor
      description: Opaque next_cursor value from the preceding list response.
      schema: {type: string}
  securitySchemes:
    browserSession:
      type: apiKey
      in: cookie
      name: __Host-control_session
  headers:
    RequestID:
      description: Server generated request identifier for support and logs.
      schema:
        type: string
  responses:
    BadRequest:
      description: Invalid request body.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: Missing, expired or invalid session or credentials.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: CSRF token missing or invalid.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Conflict:
      description: Resource already exists.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorResponse'}
    ValidationError:
      description: Input is structurally valid JSON but has invalid fields.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorResponse'}
    RateLimited:
      description: Login rate limit reached. Retry-After gives the wait in seconds.
      headers:
        Retry-After:
          schema:
            type: integer
            minimum: 1
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    InternalError:
      description: Unexpected server error.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestID'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: Resource not found.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestID'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    DependencyUnavailable:
      description: PostgreSQL is unavailable.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestID'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  schemas:
    NewResourceGroup:
      type: object
      required: [code, name, region]
      properties:
        code: {type: string, example: RFC.JPT1}
        name: {type: string}
        region: {type: string}
        enabled: {type: boolean, default: true}
    ResourceGroup:
      allOf:
        - {$ref: '#/components/schemas/NewResourceGroup'}
        - type: object
          required: [id, enabled, created_at]
          properties:
            id: {type: string, format: uuid}
            created_at: {type: string, format: date-time}
    ResourceGroupList:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/ResourceGroup'}
        next_cursor: {type: ['string', 'null']}
    NewNode:
      type: object
      required: [group_id, name, region, host, capabilities]
      properties:
        group_id: {type: string, format: uuid}
        name: {type: string}
        region: {type: string}
        host: {type: string}
        public_ip: {type: ['string', 'null']}
        proxy_port:
          type: ['integer', 'null']
          minimum: 1
          maximum: 65535
          description: Required when capabilities includes proxy; omitted for forward-only nodes.
        capabilities:
          type: array
          items: {type: string, enum: [proxy, forward]}
        bandwidth_bps: {type: ['integer', 'null'], minimum: 0}
        multiplier_milli: {type: integer, minimum: 1, default: 1000}
        tags:
          type: array
          items: {type: string}
        enabled: {type: boolean, default: true}
    Node:
      allOf:
        - {$ref: '#/components/schemas/NewNode'}
        - type: object
          required: [id, group_code, multiplier_milli, tags, enabled, agent_status, created_at]
          properties:
            id: {type: string, format: uuid}
            group_code: {type: string}
            agent_status: {type: string, enum: [unknown, online, offline, revoked]}
            last_seen_at: {type: ['string', 'null'], format: date-time}
            created_at: {type: string, format: date-time}
    NodeList:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/Node'}
        next_cursor: {type: ['string', 'null']}
    User:
      type: object
      required: [id, email, status, timezone, roles, permissions]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        status:
          type: string
          enum: [active, disabled]
        timezone:
          type: string
        roles:
          type: array
          items:
            type: string
        permissions:
          type: array
          items:
            type: string
    LoginResponse:
      type: object
      required: [user, csrf_token, expires_at]
      properties:
        user:
          $ref: '#/components/schemas/User'
        csrf_token:
          type: string
        expires_at:
          type: string
          format: date-time
    PermissionsResponse:
      type: object
      required: [roles, permissions]
      properties:
        roles:
          type: array
          items:
            type: string
        permissions:
          type: array
          items:
            type: string
    HealthResponse:
      type: object
      required: [status]
      properties:
        status:
          type: string
          const: ok
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, request_id]
          properties:
            code:
              type: string
            message:
              type: string
            request_id:
              type: string
